<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Quotes</title>

            margin: 20px;
            cursor: pointer; /* Change cursor to indicate it's clickable */
        }
        
    </style>
</head>
<body>

    <div class="quote" id="quote"></div>

    <script>
        const quotes = [
{ text: "What made you smile today?" },
{ text: "What challenges did you face today, and how did you overcome them?" },
{ text: "What is one thing you are grateful for today?" },
{ text: "How did you spend your time today, and did you enjoy it?" },
{ text: "What was one unexpected event that happened today?" },
{ text: "What did you learn today?" },
{ text: "How did you show kindness to someone today?" },
{ text: "What was the most interesting conversation you had today?" },
{ text: "How did you feel during today—happy, sad, anxious, or neutral?" },
{ text: "What are your goals for tomorrow?" },
{ text: "What did you do today that made you feel proud?" },
{ text: "What did you read or watch today that inspired you?" },
{ text: "How did you take care of yourself today?" },
{ text: "What was your favourite moment of the day?" },
{ text: "Did you face any fears today? How did that go?" },
{ text: "Who did you connect with today, and what did that relationship mean to you?" },
{ text: "What was something new you tried today?" },
{ text: "How did the weather affect your mood today?" },
{ text: "What music did you listen to today, and how did it make you feel?" },
{ text: "What are three things you accomplished today?" },
{ text: "If you could relive one moment from today, what would it be and why?" },
{ text: "How did you express yourself creatively today?" },
{ text: "What did you do today that felt good for your soul?" },
{ text: "Did you help anyone today? How did it make you feel?" },
{ text: "What is something you wished you could have done differently today?" },
{ text: "What did you learn about yourself today?" },
{ text: "How did you stay motivated today?" },
{ text: "What are you looking forward to tomorrow?" },
{ text: "Was there a moment today where you felt at peace?" },
{ text: "How did you manage your time today?" },
{ text: "What risk did you take today, and what was the outcome?" },
{ text: "What made you feel loved or appreciated today?" },
{ text: "What did you do today that brought you joy?" },
{ text: "How did you respond to stress today?" },
{ text: "What personal value did you honour today?" },
{ text: "Reflect on a moment where you felt empowered today?" },
{ text: "What did you observe in your surroundings today?" },
{ text: "Did you set boundaries today? If so, how did that feel?" },
{ text: "What is one thing you want to release from today?" },
{ text: "How did you engage with your community today?" },
{ text: "What fears did you conquer today?" },
{ text: "What does success look like for you today?" },
{ text: "How did you practice mindfulness or being present today?" },
{ text: "What did you wish you could have changed about today?" },
{ text: "How did you celebrate a small win today?" },
{ text: "What word or phrase best describes your day?" },
{ text: "What dreams did you have last night?" },
{ text: "How do you want to feel tomorrow?" },
{ text: "What sparked your curiosity today?" },
{ text: "How did you make time for self-reflection today?" },

    <div class="quote" id="quote"></div>

    <script>
        const quotes = [
            { text: "How do you want to feel tomorrow?" },
            { text: "What sparked your curiosity today?" },
            { text: "How did you make time for self-reflection today?" },
        ];

        const today = new Date();
        const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 0)) / 1000 / 60 / 60 / 24);
        const quoteOfTheDay = quotes[dayOfYear % quotes.length];

        document.getElementById('quote').innerText = quoteOfTheDay.text;

        document.getElementById('quote').onclick = function() {
            navigator.clipboard.writeText(quoteOfTheDay.text).then(() => {
                alert("Quote copied to clipboard!");
            });
        };
    </script>
</body>
</html>
