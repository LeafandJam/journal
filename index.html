        // Get the current date
        const today = new Date();
        const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 0)) / 1000 / 60 / 60 / 24);
        
        // Select the quote based on the day of the year
        const quoteOfTheDay = quotes[dayOfYear % quotes.length];

        // Display the quote
        document.getElementById('quote').innerText = quoteOfTheDay.text;

        // Display the quote
document.getElementById('quote').innerText = quoteOfTheDay.text;

// Display the quote
document.getElementById('quote').innerText = quoteOfTheDay.text;

// Add click event to copy text to clipboard
document.getElementById('quote').addEventListener('click', () => {
    navigator.clipboard.writeText(quoteOfTheDay.text).then(() => {
        const notification = document.getElementById('notification');
        notification.innerText = 'Copied';
        notification.style.display = 'block';
        
        // Position the notification above the quote
        const quoteElement = document.getElementById('quote');
        const rect = quoteElement.getBoundingClientRect();
// Position the notification for mobile view
    notification.style.left = '50%';
    notification.style.transform = 'translateX(-50%)'; // Center horizontally
    notification.style.top = '20px'; // Or whatever space from the top


        // Hide the notification after 2 seconds
        setTimeout(() => {
            notification.style.display = 'none';
        }, 2000); // Time in milliseconds
    }).catch(err => {
        console.error('Failed to copy: ', err);
    });
});
